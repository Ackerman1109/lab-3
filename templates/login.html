<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="auth">

        <div class="logo">Instagram</div>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Log in
            </button>

        </form>

        <p class="forgot">
            Forgot password?
        </p>

    </div>


    <div class="login-box">

        <p>
            Don't have an account?
            <a href="/register">Sign up</a>
        </p>

    </div>

</body>
</html>
